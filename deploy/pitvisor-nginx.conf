server {
    listen 80;
    server_name pitvisor.ojee.net api.pitvisor.ojee.net pitvisor-api.ojee.net;

    client_max_body_size 50M;

    # Live timing service (SignalR subscriber + SSE).
    # Long-lived streaming responses — disable buffering and the proxy read
    # timer, and make sure proxy_buffering is off so SSE events are flushed
    # to the client immediately instead of piling up in nginx's buffer.
    location /live/ {
        proxy_pass http://127.0.0.1:5101/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        chunked_transfer_encoding on;
    }

    location / {
        proxy_pass http://127.0.0.1:5100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
        proxy_connect_timeout 60s;
    }
}

# redirect old domain
server {
    listen 80;
    server_name bluef1ag.ojee.net;
    return 301 https://pitvisor.ojee.net$request_uri;
}
